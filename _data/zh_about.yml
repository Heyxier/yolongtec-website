hero:
  subtitle: 自2008年起专业提供电动工具及OEM/ODM解决方案
profile:
  image: ../images/building.jpg
  paragraphs:
    - >-
      园龙科技成立于2008年，总部位于苏州，专注于园林电动工具（无绳、电动及汽油动力）以及电动工具（包括砂光机械）的研发与制造。
      我们的产品线涵盖割草机、草坪修剪机、割灌机、吹吸风机、链锯、砂光机、电钻、冲击扳手、电锤、切割机及工作灯等。
    - >-
      公司拥有13,500平方米的生产基地和250多名熟练员工，年产能达100万件。
      我们主要服务于OEM和ODM市场，产品远销北美、欧洲、澳洲和南美洲，
      始终秉持"高品质、优价格、合作共赢"的经营理念。
values:
  - number: '01'
    title: 卓越品质
    text: >-
      我们对所有产品坚持严格的质量标准。从原材料选择到最终组装，每一个环节都受到严格控制，
      确保产品性能可靠，值得全球合作伙伴信赖。
  - number: '02'
    title: 价格实惠
    text: >-
      通过高效的生产制造和供应链管理，我们在不牺牲品质的前提下提供高性价比的解决方案，
      让专业级园林工具惠及全球市场。
  - number: '03'
    title: 合作共赢
    text: >-
      我们坚信建立在互利基础上的长期合作伙伴关系。我们的OEM/ODM服务旨在通过灵活的定制
      和可靠的支持，帮助客户拓展业务。
  - number: '04'
    title: 持续创新
    text: >-
      凭借在园林和电动工具领域超过14年的经验，我们的团队不断改进产品设计、采用新技术、
      优化生产流程，以保持市场领先地位。
global:
  - figure: '13,500'
    unit: 平方米
    title: 生产基地
    text: >-
      现代化制造工厂位于苏州市相城区太平街道陈泰路17号，配备高效生产园林及电动工具的先进设备。
  - figure: 1M
    unit: ''
    title: 年产能
    text: >-
      年产量达100万件，以稳定的品质和及时的交付，可靠地服务于四大洲的OEM和ODM客户。
  - figure: 250+
    unit: ''
    title: 熟练员工
    text: >-
      一支由250多名专业人员组成的敬业团队，齐心协力设计、制造和交付高品质的园林动力工具到全球市场。
  - figure: '4'
    unit: ''
    title: 服务大洲
    text: >-
      我们的产品远销北美、欧洲、澳洲和南美洲，通过卓越的品质和合作共赢的理念建立了持久的合作伙伴关系。
